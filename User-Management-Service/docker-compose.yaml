services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: service_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file: .env
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 2s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: service_redis
    restart: always
    ports:
      - "6379:6379"
    env_file: .env
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 2s
      timeout: 2s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: service_database
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_management_service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  postgres_data:
  redis_data:
networks:
  default:
    name: shared_net
    external: true
