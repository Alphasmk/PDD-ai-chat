[project]
name = "user-management-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aio-pika==9.6.2",
    "aioboto3==15.5.0",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi==0.135.1",
    "fastapi-error-map==0.9.10",
    "fastapi-pagination==0.15.12",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.13.1",
    "pydantic[email]==2.12.5",
    "pyjwt[crypto]==2.12.1",
    "python-multipart==0.0.22",
    "redis==7.4.0",
    "sqlalchemy[asyncio]==2.0.48",
    "types-aioboto3[s3]==15.5.0",
    "types-redis==4.6.0.20241004",
    "uvicorn==0.42.0",
]
[tool.coverage.run]
source = ["source"]
omit = [
    "tests/*",
    "settings/config.py",
    "source/application/interfaces/*",
    "source/application/dto/*",
    "source/presentation/api/schemas/*",
    "source/domain/interfaces/*",
    "*/__init__.py"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
import_mode = "importlib"

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-cov>=7.1.0",
    "pre-commit==4.5.1"
]
