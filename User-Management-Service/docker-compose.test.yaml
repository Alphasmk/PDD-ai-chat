services:
  postgres_test:
    image: postgres:16-alpine
    env_file: .env.test
    ports:
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
  redis_test:
    image: redis:7-alpine
    ports:
      - "${TEST_REDIS_PORT:-6380}:6379"
    env_file: .env.test
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 2s
      timeout: 2s
      retries: 5
  rabbitmq_test:
    image: rabbitmq:4-management-alpine
    ports:
      - "${TEST_BROKER_PORT:-5673}:5672"
      - "${TEST_BROKER_MANAGEMENT_PORT:-15673}:15672"
    env_file: .env.test
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 2s
      retries: 5

  app_test:
    profiles: ["startup"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres_test
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable
      POSTGRES_NAME: ums_test
      REDIS_HOST: redis_test
      REDIS_PORT: 6379
      REDIS_PASSWORD: disposable
      BROKER_HOST: rabbitmq_test
      BROKER_PORT: 5672
      BROKER_USER: test
      BROKER_PASSWORD: disposable
      SECRET_KEY: disposable-startup-secret-32-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      AWS_ACCESS_KEY_ID: disposable
      AWS_ACCESS_KEY: disposable
      AWS_REGION_NAME: us-east-1
      AWS_BUCKET_NAME: disposable
    ports:
      - "${TEST_APP_PORT:-8001}:8000"
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
      rabbitmq_test:
        condition: service_healthy
